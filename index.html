<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to your ReviewAudit research workspace.">
  <meta http-equiv="refresh" content="0; url=https://review-audit-seven.vercel.app/#/login">
  <link rel="canonical" href="https://review-audit-seven.vercel.app/">
  <title>Sign in | ReviewAudit</title>
  <script>
    window.location.replace("https://review-audit-seven.vercel.app/#/login");
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #293747; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding: 18px 6%; background: #802719; color: #fff; font-size: 30px; font-weight: 700; }
    header span { font-weight: 400; }
    main { max-width: 520px; margin: 72px auto; padding: 28px; border: 1px solid #e4e1dd; background: #f7f6f4; }
    h1 { margin-top: 0; font-size: 26px; }
    p { line-height: 1.6; }
    a { color: #3e6b7a; }
    .primary { display: inline-block; padding: 12px 22px; background: #3e6b7a; color: #fff; text-decoration: none; border-radius: 2px; }
    a:focus-visible { outline: 3px solid #802719; outline-offset: 4px; }
    @media (max-width: 560px) { main { margin: 32px 20px; } }
  </style>
</head>
<body>
  <header>Review<span>Audit</span></header>
  <main>
    <h1>Opening sign in…</h1>
    <p>Your ReviewAudit login page will open automatically.</p>
    <p><a class="primary" href="https://review-audit-seven.vercel.app/#/login">Continue to sign in</a></p>
    <p>New to ReviewAudit? <a href="https://review-audit-seven.vercel.app/#/register">Create an account</a></p>
  </main>
</body>
</html>
